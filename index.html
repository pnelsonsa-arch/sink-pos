<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jubilee Hotel & Bottle Store POS</title>

    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f1115">
    <link rel="icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        jubileeBg: '#0f1115',
                        jubileeCard: '#161a22',
                        jubileeBorder: '#21262d',
                        cyanNeon: '#00f0ff',
                        magentaNeon: '#ff007f',
                        emeraldNeon: '#10b981'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Html5-QRCode Scanner Library -->
    <script src="https://cloudflare.com"></script>
</head>
<body class="bg-jubileeBg text-gray-100 font-sans antialiased h-screen overflow-hidden flex flex-col">

    <!-- LOGIN / AUTHENTICATION OVERLAY -->
    <div id="loginOverlay" class="fixed inset-0 z-50 bg-jubileeBg/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-jubileeCard border border-jubileeBorder rounded-3xl p-8 w-full max-w-md shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-cyanNeon/10 border border-cyanNeon/30 rounded-2xl mx-auto flex items-center justify-center text-cyanNeon text-2xl font-bold">
                    <i class="fa-solid fa-wine-bottle"></i>
                </div>
                <h1 class="text-2xl font-black text-white tracking-wide">JUBILEE POS</h1>
                <p class="text-xs text-gray-400">Hotel & Bottle Store Management System</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Select Team Member</label>
                    <select id="loginUserSelect" onchange="fillUserPin()" class="w-full bg-[#0a0a0c] border border-jubileeBorder rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyanNeon"></select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Security PIN</label>
                    <input type="password" id="loginPinInput" maxlength="4" placeholder="Enter 4-digit PIN" class="w-full bg-[#0a0a0c] border border-jubileeBorder rounded-xl p-3 text-center text-lg font-mono text-cyanNeon focus:outline-none focus:border-cyanNeon" required />
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 bg-cyanNeon text-gray-950 font-bold py-3 rounded-xl text-sm transition-all hover:opacity-90 shadow-lg shadow-cyanNeon/20">
                        Sign In
                    </button>
                    <button type="button" onclick="openQrLoginModal()" class="bg-[#0a0a0c] border border-jubileeBorder hover:border-cyanNeon text-cyanNeon px-4 py-3 rounded-xl text-sm transition-all" title="Scan QR Code / Badge">
                        <i class="fa-solid fa-qrcode text-lg"></i>
                    </button>
                </div>
            </form>

            <div class="pt-4 border-t border-jubileeBorder flex justify-between items-center text-xs">
                <button onclick="openNewUserModal()" class="text-cyanNeon hover:underline"><i class="fa-solid fa-user-plus mr-1"></i> Add New Staff</button>
                <span class="text-gray-500 font-mono">v3.7 Offline PWA</span>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="appContainer" class="hidden flex-1 flex flex-col h-screen overflow-hidden">

        <!-- HEADER NAVBAR -->
        <header class="bg-jubileeCard border-b border-jubileeBorder px-4 lg:px-6 py-3 flex flex-wrap items-center justify-between gap-2 shrink-0">
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-cyanNeon/10 border border-cyanNeon/30 flex items-center justify-center text-cyanNeon font-bold">
                        <i class="fa-solid fa-wine-glass-empty text-sm"></i>
                    </div>
                    <div>
                        <h2 class="font-extrabold text-xs sm:text-sm text-white tracking-wider">JUBILEE HOTEL & BOTTLE STORE</h2>
                        <div class="flex items-center gap-2 text-[10px] text-gray-400">
                            <span id="currentRoleBadge" class="bg-cyanNeon/10 text-cyanNeon px-1.5 py-0.5 rounded font-semibold">Admin</span>
                            <span>•</span>
                            <!-- Active Staff / Cashier Selector -->
                            <div class="flex items-center gap-1">
                                <i class="fa-solid fa-id-badge text-cyanNeon"></i>
                                <select id="activeStaffSelect" onchange="switchActiveStaff(this.value)" class="bg-[#0a0a0c] border border-jubileeBorder rounded px-1.5 py-0.5 text-[11px] font-semibold text-white focus:outline-none focus:border-cyanNeon" title="Active Cashier / Staff ID">
                                </select>
                            </div>
                            <span id="deviceBadge" class="hidden xl:inline text-gray-500 font-mono"></span>
                        </div>
                    </div>
                </div>

                <!-- NAV TABS -->
                <nav class="hidden lg:flex items-center gap-1.5 bg-[#0a0a0c] p-1 border border-jubileeBorder rounded-xl ml-4">
                    <button onclick="switchTab('pos')" id="tabBtn-pos" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all bg-cyanNeon text-gray-950 shadow">POS Till</button>
                    <button onclick="switchTab('inventory')" id="tabBtn-inventory" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-gray-400 hover:text-white">Inventory & Prices</button>
                    <button onclick="switchTab('grv')" id="tabBtn-grv" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-gray-400 hover:text-white">GRV Receiving</button>
                    <button onclick="switchTab('cashup')" id="tabBtn-cashup" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-gray-400 hover:text-white">Daily Summary & Cash-Up</button>
                    <button onclick="switchTab('reorder')" id="tabBtn-reorder" class="px-3.5 py-2 rounded-xl text-xs font-semibold transition-all text-gray-400 hover:text-white">Reorder System</button>
                </nav>
            </div>

            <div class="flex items-center gap-2">
                <!-- OFFLINE / PENDING SYNC BADGE -->
                <button id="pendingSyncBadge" onclick="flushSyncQueue(true)" class="hidden bg-amber-500/20 border border-amber-400/50 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 animate-pulse hover:bg-amber-500/30 transition-all" title="Click to retry syncing queued offline transactions">
                    <i class="fa-solid fa-rotate"></i>
                    <span id="pendingSyncText">Pending Sync (0)</span>
                </button>

                <!-- CONNECTION PILL -->
                <div id="networkStatusPill" class="bg-emeraldNeon/10 border border-emeraldNeon/30 text-emeraldNeon px-2.5 py-1.5 rounded-xl text-[11px] font-semibold flex items-center gap-1.5">
                    <span id="networkDot" class="w-2 h-2 rounded-full bg-emeraldNeon"></span>
                    <span id="networkLabel">Online</span>
                </div>

                <button onclick="openPayoutModal()" class="bg-[#0a0a0c] border border-jubileeBorder hover:border-magentaNeon px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all text-magentaNeon" title="Record Cash Payout / Expense">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    <span class="hidden sm:inline">Payouts</span>
                </button>
                <button onclick="openSyncModal()" class="bg-[#0a0a0c] border border-jubileeBorder hover:border-cyanNeon px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-cloud text-cyanNeon"></i>
                    <span class="hidden xl:inline">Sheets Sync</span>
                    <span id="cloudStatusBadge" class="w-2 h-2 rounded-full bg-emeraldNeon"></span>
                </button>
                <button onclick="logout()" class="bg-magentaNeon/10 border border-magentaNeon/30 hover:bg-magentaNeon/20 text-magentaNeon px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="hidden sm:inline">Logout</span>
                </button>
            </div>

            <!-- MOBILE / TABLET NAV BAR -->
            <nav class="flex lg:hidden w-full overflow-x-auto gap-1.5 bg-[#0a0a0c] p-1 border border-jubileeBorder rounded-xl mt-1">
